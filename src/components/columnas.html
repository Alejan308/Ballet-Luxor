<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Columna Egipcia</title>
<style>
  body {
    background-color: #f4e2b8; /* Arena */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .columna {
    width: 80px;
    height: 400px;
    background: linear-gradient(#d4af37, #b8860b); /* Dorado */
    border: 4px solid #5c3b00;
    position: relative;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
  }

  /* Capitel (parte superior) */
  .columna::before {
    content: "";
    position: absolute;
    top: -40px;
    left: -20px;
    width: 120px;
    height: 40px;
    background: linear-gradient(#b8860b, #8b6914);
    border: 4px solid #5c3b00;
    border-radius: 10px 10px 0 0;
  }

  /* Base */
  .columna::after {
    content: "";
    position: absolute;
    bottom: -20px;
    left: -10px;
    width: 100px;
    height: 20px;
    background: linear-gradient(#b8860b, #8b6914);
    border: 4px solid #5c3b00;
    border-radius: 0 0 5px 5px;
  }

  /* Decoración jeroglífica */
  .decoracion {
    position: absolute;
    top: 50px;
    width: 100%;
    height: 300px;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.2) 0px,
      rgba(0,0,0,0.2) 2px,
      transparent 2px,
      transparent 20px
    );
  }
</style>
</head>
<body>

<div class="columna">
  <div class="decoracion"></div>
</div>

</body>
</html>
